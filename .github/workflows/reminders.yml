# Hourly 24h-reminder trigger — use this if you're on Vercel Hobby (whose cron only
# runs once a day). It's safe to run alongside Vercel Cron: reminders are claimed
# atomically, so nobody gets two emails.
#
# Setup (GitHub → Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://northside-physio.vercel.app   (variable or secret)
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
name: Send appointment reminders

on:
  schedule:
    - cron: '7 * * * *' # every hour at :07 (UTC); GitHub may delay a few minutes
  workflow_dispatch: {}

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reminder endpoint
        env:
          APP_URL: ${{ vars.APP_URL || secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::APP_URL or CRON_SECRET not configured — skipping."; exit 0
          fi
          curl --fail-with-body --silent --show-error --retry 3 --retry-delay 10 --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"
